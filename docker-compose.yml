services:
  db:
    image: postgres:15-alpine
    container_name: baddelha_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: baddelha_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build: .
    container_name: baddelha_api
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app # For local development (hot-reload)
      - uploads_data:/app/uploads # Persist uploads
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  api-test:
    build: .
    container_name: baddelha_api_test
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - .:/app # For getting the latest test files without rebuilding
    command: pytest
    profiles:
      - test

volumes:
  postgres_data:
  uploads_data:
